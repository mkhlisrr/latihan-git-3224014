name: Java Unit Testing

on:
  push:
    branches: [main, feature-test]
  pull_request:
    branches: [main]

jobs:
  unit-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download Testing Libraries
        run: |
          mkdir -p lib build/classes build/test-classes

          curl -L -o lib/junit-platform-console-standalone.jar \
            https://repo.maven.apache.org/maven2/org/junit/platform/junit-platform-console-standalone/1.10.2/junit-platform-console-standalone-1.10.2.jar

          curl -L -o lib/jacocoagent.jar \
            https://repo.maven.apache.org/maven2/org/jacoco/org.jacoco.agent/0.8.12/org.jacoco.agent-0.8.12-runtime.jar

          curl -L -o lib/jacococli.jar \
            https://repo.maven.apache.org/maven2/org/jacoco/org.jacoco.cli/0.8.12/org.jacoco.cli-0.8.12-nodeps.jar

      - name: Compile Application
        run: |
          javac -d build/classes src/main/java/BankAccount.java

      - name: Compile Unit Tests
        run: |
          javac -cp "build/classes:lib/junit-platform-console-standalone.jar" \
            -d build/test-classes src/test/java/BankAccountTest.java

      - name: Run Unit Tests
        run: |
          java -javaagent:lib/jacocoagent.jar=destfile=build/jacoco.exec \
            -jar lib/junit-platform-console-standalone.jar execute \
            --class-path build/classes:build/test-classes \
            --scan-class-path

      - name: Generate Code Coverage Report
        if: always()
        run: |
          if [ -f build/jacoco.exec ]; then
            java -jar lib/jacococli.jar report build/jacoco.exec \
              --classfiles build/classes \
              --sourcefiles src/main/java \
              --html build/site/jacoco \
              --xml build/site/jacoco/jacoco.xml
          fi

      - name: Upload Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-code-coverage
          path: build/site/jacoco/
          if-no-files-found: warn